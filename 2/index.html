<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stopwatch Program</title>
</head>
<body>

  <div class="StopWatch">

  <h1 class="baslık">Kronometre</h1>

  <h1 id="time">00:00</h1>

  <button class="StartBtn"
   onclick="startClock()">Başlat</button>

  <button class="StopBtn"
   onclick="stopClock()">Durdur</button>

  <button class="ResetBtn"
   onclick="resetClock()">Sıfırla</button>

  </div>

  <script src="1main.js"></script>
</body>
</html>
